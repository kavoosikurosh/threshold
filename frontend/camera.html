<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Take a photo · Threshold</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="static/manifest.json">
<link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Threshold">
<link rel="stylesheet" href="static/app.css">
<script src="static/threshold.js"></script>
<style>
  /* [final] Camera, like the iPhone camera app: black, white controls, nothing extra. */
  html, body { height: 100%; }
  body { background: #000; color: #fff; overflow: hidden; }
  .cam { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .cam .nav { position: static; background: #000; }
  .cam .nav-btn { color: #fff; }
  .cam .nav-title { opacity: 1; color: #fff; }
  .room-btn { min-height: 44px; border: 0; background: rgba(255,255,255,.16); color: #fff; border-radius: 22px; padding: 0 16px; font-weight: 600; cursor: pointer; }
  .finder { position: relative; flex: 1; min-height: 0; background: #000; }
  .finder video, .finder img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .finder img { display: none; }
  .reviewing .finder img { display: block; }
  .tip { position: absolute; left: 16px; right: 16px; top: 8px; text-align: center; font-size: .941rem; }
  .tip span { display: inline-block; background: rgba(0,0,0,.6); border-radius: 16px; padding: 4px 12px; }
  .nocam { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 0 32px; }
  .nocam p { color: rgba(235,235,245,.7); margin: 8px 0 16px; }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 16px 32px calc(var(--safe-b) + 16px); background: #000; }
  .reviewing .controls { visibility: hidden; }
  .lib { width: 48px; height: 48px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.16); cursor: pointer; justify-self: start; }
  .shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: none; padding: 4px; cursor: pointer; }
  .shutter span { display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff; }
  .shutter:active span { transform: scale(.9); }
  .shutter:disabled { opacity: .4; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
  .review { color: var(--label); }
  .review h2 { margin: 0 0 8px; font-size: 1.294rem; font-weight: 700; text-align: center; }
  .review p { margin: 0 0 16px; color: var(--label2); text-align: center; }
  .review .note { margin: 0 0 16px; }
  .review .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .review .btn { margin: 0; }
</style>
</head>
<body>
<div class="cam" id="cam">
  <header class="nav always">
    <div class="nav-in">
      <div class="nav-left"><a class="nav-btn back" href="home.html">Cancel</a></div>
      <div class="nav-title"><button class="room-btn" type="button" id="roomBtn" aria-haspopup="dialog">Choose room</button></div>
      <div class="nav-right"></div>
    </div>
  </header>
  <div class="finder">
    <video id="video" playsinline muted autoplay aria-label="Camera view"></video>
    <img id="still" alt="The photo you just took">
    <p class="tip" id="tip" role="status"><span id="tipText">Stand in the doorway. Get the floor in the photo.</span></p>
    <div class="nocam" id="nocam" hidden>
      <div><b>The camera isn't available</b><p>You can choose a photo of the room instead.</p>
        <label class="btn primary" for="pick" style="display:inline-flex;width:auto;padding:0 24px">Choose a photo</label></div>
    </div>
  </div>
  <div class="controls">
    <label class="lib" for="pick" aria-label="Choose a photo from your library" role="button" tabindex="0">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 9"/></svg>
    </label>
    <button class="shutter" type="button" id="shutter" aria-label="Take photo"><span></span></button>
    <span></span>
  </div>
  <input type="file" id="pick" accept="image/*">
</div>

<!-- review (sheet) -->
<section class="sheet review" id="reviewSheet" aria-labelledby="reviewHead">
  <div class="grabber" aria-hidden="true"></div>
  <h2 id="reviewHead">Use this photo?</h2>
  <p>Check that the floor and anything you walk around are in it.</p>
  <p class="note" id="darkWarn" hidden>This photo looks dark. Turning on a light helps Threshold spot more.</p>
  <div class="yn">
    <button class="btn" type="button" id="retake">Retake</button>
    <button class="btn primary" type="button" id="usePhoto">Check room</button>
  </div>
</section>

<script>
const T = Threshold;
const $ = id => document.getElementById(id);
const TIPS = {
  "Bathroom": "Include the toilet and tub. Grab bars and bath mats matter most.",
  "Bedroom": "Show the path from the bed to the door.",
  "Living room": "Stand in the doorway. Get the whole floor, rugs and cords too.",
  "Kitchen": "Aim at the floor by the counters.",
  "Stairs": "Stand at the bottom and aim up. Show the steps and the railing.",
  "Hallway": "Show the full length of the floor and any door thresholds.",
  "Other": "Stand in the doorway. Get the floor in the photo.",
};
const MAX_SIDE = 1600;              // photos are resized before handoff so they fit in sessionStorage
const video = $("video"), still = $("still");
let room = null, stream = null, photoData = null;

function setRoom(r) {
  room = r;
  $("roomBtn").textContent = r === "Other" ? "Other room" : r;
  $("tipText").textContent = TIPS[r] || TIPS.Other;
}
$("roomBtn").addEventListener("click", () => T.roomSheet(setRoom, { title: "Which room?" }));
// A room can be passed in: camera.html?room=Stairs
const preset = new URLSearchParams(location.search).get("room");
if (preset && TIPS[preset]) setRoom(preset);
else setTimeout(() => T.roomSheet(setRoom, { title: "Which room?" }), 250);

// ── camera ──
function noCamera() { $("nocam").hidden = false; $("shutter").disabled = true; $("tip").hidden = true; }
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
    video.srcObject = stream;
  } catch (e) { noCamera(); }
}
if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) startCamera(); else noCamera();

function toJpeg(source, w, h) {
  const scale = Math.min(1, MAX_SIDE / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.round(w * scale); c.height = Math.round(h * scale);
  c.getContext("2d").drawImage(source, 0, 0, c.width, c.height);
  // average brightness from a small sample, to warn about dark photos
  const s = document.createElement("canvas"); s.width = 32; s.height = 32;
  const sx = s.getContext("2d"); sx.drawImage(c, 0, 0, 32, 32);
  const px = sx.getImageData(0, 0, 32, 32).data;
  let sum = 0; for (let i = 0; i < px.length; i += 4) sum += 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
  return { data: c.toDataURL("image/jpeg", 0.88), dark: sum / (px.length / 4) < 60 };
}
function review(result) {
  photoData = result.data;
  still.src = photoData;
  $("darkWarn").hidden = !result.dark;
  $("cam").classList.add("reviewing");
  if (stream) video.pause();
  T.openSheet($("reviewSheet"));
}
$("reviewSheet").onclose = () => { if (!photoData) return; };
$("shutter").addEventListener("click", () => {
  if (!room) return T.roomSheet(setRoom, { title: "Which room?" });
  if (!video.videoWidth) return;
  T.haptic();
  review(toJpeg(video, video.videoWidth, video.videoHeight));
});
$("pick").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  const im = new Image();
  im.onload = () => { review(toJpeg(im, im.naturalWidth, im.naturalHeight)); URL.revokeObjectURL(im.src); };
  im.src = URL.createObjectURL(file);
  e.target.value = "";
  if (!room) setRoom("Other");
});
$("retake").addEventListener("click", () => {
  T.closeSheet($("reviewSheet"));
  $("cam").classList.remove("reviewing");
  photoData = null;
  if (stream) video.play();
});

// Check the photo with the backend, then open report.html.
const usePhoto = $("usePhoto");
usePhoto.addEventListener("click", async () => {
  if (!photoData || usePhoto.disabled) return;
  T.haptic();
  usePhoto.disabled = true;
  usePhoto.textContent = "Checking…";
  try {
    const blob = await (await fetch(photoData)).blob();
    const roomName = room === "Other" ? null : room;
    const report = await T.analyzeImage(blob, roomName);   // [final] room context
    const w = report.image_width || still.naturalWidth, h = report.image_height || still.naturalHeight;
    const data = { room: roomName, date: new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }),
                   source: "photo", frames: [{ image: photoData, width: w, height: h }], main: 0, offset: null,
                   detections: report.detections || null, report, image: photoData, width: w, height: h };
    T.saveLastReport(data);
    if (stream) stream.getTracks().forEach(t => t.stop());
    location.href = "report.html";
  } catch (e) {
    T.toast("Couldn't check this photo. Please try again.");
    usePhoto.disabled = false;
    usePhoto.textContent = "Check room";
  }
});
</script>
</body>
</html>
